<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="巴士ETA">
<title>巴士到站時間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root,[data-theme="light"]{
    --bg:#f5f5f0;--surface:#fff;--surface2:#f9f9f7;--border:#e0ddd8;
    --text:#1a1a16;--muted:#6b6a67;--faint:#a8a7a4;
    --primary:#01696f;--primary-h:#0c4e54;--primary-l:#e0eeee;
    --success:#437a22;--warn:#c55700;--err:#a12c2c;--orange:#da7101;
    --mtr:#c00;--shadow-s:0 1px 3px rgba(0,0,0,.07);--shadow-m:0 4px 12px rgba(0,0,0,.08);
    --r-s:.375rem;--r-m:.625rem;--r-l:1rem;--r-f:9999px;--t:180ms cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"]{
    --bg:#131311;--surface:#1c1c1a;--surface2:#232320;--border:#333330;
    --text:#d4d3d0;--muted:#7a7975;--faint:#555450;
    --primary:#4f9ea3;--primary-h:#3a8389;--primary-l:#1e3434;
    --success:#6daa45;--warn:#fdab43;--err:#e06060;--orange:#fdab43;
    --mtr:#ff6666;--shadow-s:0 1px 3px rgba(0,0,0,.25);--shadow-m:0 4px 12px rgba(0,0,0,.35);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:none}
  body{font-family:'Noto Sans TC',sans-serif;font-size:1rem;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
  button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
  input,select{font:inherit;color:inherit}
  .header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:.875rem 1rem;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-s)}
  .logo{display:flex;align-items:center;gap:.5rem;font-size:1.1rem;font-weight:700;color:var(--primary)}
  .theme-btn{width:2.5rem;height:2.5rem;border-radius:var(--r-f);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background var(--t)}
  .theme-btn:hover{background:var(--border);color:var(--text)}
  .main{padding:1rem;max-width:480px;margin:0 auto;padding-bottom:5rem}
  .section-label{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;margin-top:1.25rem}
  .card{background:var(--surface);border-radius:var(--r-l);border:1px solid var(--border);padding:1rem;box-shadow:var(--shadow-s)}
  .field-row{display:flex;flex-direction:column;gap:.375rem;margin-bottom:.75rem}
  .field-label{font-size:.8125rem;font-weight:500;color:var(--muted)}
  .field-input{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-m);padding:.625rem .75rem;font-size:1rem;width:100%;transition:border-color var(--t),box-shadow var(--t);-webkit-appearance:none;appearance:none}
  .field-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(1,105,111,.15)}
  .search-btn{background:var(--primary);color:#fff;border-radius:var(--r-m);padding:.625rem 1rem;font-size:.9375rem;font-weight:600;width:100%;margin-top:.75rem;transition:background var(--t),transform var(--t);box-shadow:var(--shadow-s)}
  .search-btn:hover{background:var(--primary-h)}
  .search-btn:active{transform:scale(.98)}
  .search-btn:disabled{opacity:.55;pointer-events:none}
  .stop-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);overflow:hidden;margin-top:.5rem}
  .stop-item{display:flex;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--t);gap:.75rem}
  .stop-item:last-child{border-bottom:none}
  .stop-item:hover{background:var(--surface2)}
  .stop-item:active,.stop-item.selected{background:var(--primary-l)}
  .stop-seq{font-size:.75rem;font-weight:700;color:var(--faint);width:1.5rem;flex-shrink:0;text-align:center}
  .stop-info{flex:1;min-width:0}
  .stop-name{font-size:.9375rem;font-weight:600}
  .stop-sub{font-size:.75rem;color:var(--muted)}
  .stop-chk{color:var(--primary);flex-shrink:0;display:none}
  .stop-item.selected .stop-chk{display:block}
  .eta-card{background:var(--surface);border-radius:var(--r-l);border:1px solid var(--border);box-shadow:var(--shadow-m);overflow:hidden}
  .eta-head{background:var(--primary);color:#fff;padding:.875rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
  .eta-head.mtr{background:var(--mtr)}
  .eta-badge{font-size:1.5rem;font-weight:700;line-height:1}
  .eta-dest{font-size:.8125rem;opacity:.88}
  .eta-sname{font-size:.9rem;font-weight:600;margin-top:.25rem;opacity:.9}
  .ref-btn{width:2.25rem;height:2.25rem;border-radius:var(--r-f);background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;transition:background var(--t)}
  .ref-btn:hover{background:rgba(255,255,255,.25)}
  .ref-btn.spin svg{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eta-rows{padding:.25rem 0}
  .eta-row{display:flex;align-items:center;padding:.875rem 1rem;border-bottom:1px solid var(--border);gap:.75rem}
  .eta-row:last-child{border-bottom:none}
  .eta-idx{width:1.5rem;height:1.5rem;border-radius:var(--r-f);background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--muted);flex-shrink:0}
  .eta-tb{flex:1}
  .eta-hm{font-size:1.05rem;font-weight:700}
  .eta-rmk{font-size:.75rem;color:var(--muted)}
  .eta-min{font-size:1.05rem;font-weight:700;text-align:right}
  .eta-min.arriving{color:var(--warn)}.eta-min.soon{color:var(--orange)}.eta-min.normal{color:var(--success)}.eta-min.gone{color:var(--err)}
  .eta-lbl{font-size:.7rem;color:var(--muted);text-align:right}
  .status-box{text-align:center;padding:2.5rem 1.5rem;color:var(--muted)}
  .status-box h3{font-size:1rem;font-weight:600;color:var(--text);margin-bottom:.375rem}
  .status-box p{font-size:.875rem}
  .upd{font-size:.75rem;color:var(--faint);text-align:center;padding:.75rem 1rem;border-top:1px solid var(--border)}
  .fav-hd{display:flex;align-items:center;margin-bottom:.5rem;margin-top:1.25rem}
  .fav-list{display:flex;flex-direction:column;gap:.5rem}
  .fav-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem;box-shadow:var(--shadow-s)}
  .fav-info-wrap{flex:1;min-width:0;cursor:pointer}
  .fav-pill{background:var(--primary);color:#fff;border-radius:var(--r-s);padding:.25rem .5rem;font-size:.875rem;font-weight:700;flex-shrink:0;min-width:2.75rem;text-align:center;cursor:pointer}
  .fav-pill.mtr{background:var(--mtr)}
  .fav-sname{font-size:.9375rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav-dest{font-size:.75rem;color:var(--muted)}
  .fav-del{width:2rem;height:2rem;border-radius:var(--r-f);display:flex;align-items:center;justify-content:center;color:var(--faint);flex-shrink:0;transition:background var(--t),color var(--t)}
  .fav-del:hover{background:var(--border);color:var(--err)}
  .save-btn{background:none;border:1px solid var(--border);border-radius:var(--r-m);padding:.5rem .875rem;font-size:.8125rem;color:var(--muted);display:flex;align-items:center;gap:.375rem;transition:all var(--t);margin-top:.75rem;width:100%;justify-content:center}
  .save-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-l)}
  .hint{font-size:.72rem;color:var(--faint);text-align:center;margin-top:.4rem}
  .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:.625rem 1.25rem;border-radius:var(--r-f);font-size:.875rem;font-weight:500;z-index:200;transition:transform 300ms cubic-bezier(.16,1,.3,1),opacity 300ms;opacity:0;white-space:nowrap;box-shadow:var(--shadow-m)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .mtr-note{font-size:.78rem;color:var(--muted);background:var(--surface2);border-radius:var(--r-m);padding:.5rem .75rem;margin-top:.5rem;border:1px solid var(--border)}
</style>
</head>

<header class="header">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
      <rect x="2" y="6" width="22" height="14" rx="3" fill="var(--primary)" opacity=".15"/>
      <rect x="2" y="6" width="22" height="14" rx="3" stroke="var(--primary)" stroke-width="1.75"/>
      <rect x="5" y="9" width="5" height="4" rx="1" fill="var(--primary)"/>
      <rect x="11" y="9" width="5" height="4" rx="1" fill="var(--primary)"/>
      <rect x="17" y="9" width="4" height="4" rx="1" fill="var(--primary)"/>
      <circle cx="7" cy="21" r="2" fill="var(--primary)"/>
      <circle cx="19" cy="21" r="2" fill="var(--primary)"/>
    </svg>
    巴士ETA
  </div>
  <button class="theme-btn" data-theme-toggle aria-label="切換深色模式">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</header>

<main class="main">
  <div id="favSection">
    <div class="fav-hd"><div class="section-label" style="margin:0">常用路線</div></div>
    <div class="fav-list" id="favList">
      <div class="status-box" style="padding:1.25rem"><p>未有常用路線，搜尋後可儲存</p></div>
    </div>
  </div>

  <div class="section-label">搜尋路線</div>
  <div class="card">
    <div class="field-row">
      <div class="field-label">巴士公司</div>
      <select class="field-input" id="companySelect" onchange="onCoChange()">
        <option value="KMB">九巴 / 龍運 (KMB/LWB)</option>
        <option value="CTB">城巴 (CTB)</option>
        <option value="MTR">港鐵巴士 (MTR Bus)</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field-label">路線號碼</div>
      <input class="field-input" type="text" id="routeInput" placeholder="例如 K53、K53S、268C、E34A" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="field-row" id="dirRow">
      <div class="field-label">方向</div>
      <select class="field-input" id="dirSelect">
        <option value="outbound">去程 (outbound)</option>
        <option value="inbound">回程 (inbound)</option>
      </select>
    </div>
    <div id="mtrNote" class="mtr-note" style="display:none">💡 港鐵巴士循環綫（如 K53、K53S）選去程即可</div>
    <button class="search-btn" id="searchBtn" onclick="doSearch()">搜尋站點</button>
  </div>

  <div id="stopSection" style="display:none">
    <div class="section-label">選擇站點</div>
    <div class="stop-list" id="stopList"></div>
  </div>

  <div id="etaSection" style="display:none">
    <div class="section-label">到站時間</div>
    <div class="eta-card">
      <div class="eta-head" id="etaHead">
        <div>
          <div class="eta-badge" id="etaBadge"></div>
          <div class="eta-dest" id="etaDest"></div>
          <div class="eta-sname" id="etaSname"></div>
        </div>
        <button class="ref-btn" id="refBtn" onclick="doRefresh()" aria-label="重新整理">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
      <div class="eta-rows" id="etaRows"></div>
      <div class="upd" id="upd"></div>
    </div>
    <button class="save-btn" onclick="saveFav()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      儲存為常用路線
    </button>
    <div class="hint">💾 儲存後請將網址加入 Safari 書籤，以保留常用路線</div>
  </div>
</main>

<div class="toast" id="toast"></div>

let S = {company:'KMB',route:'',dir:'outbound',stopSeq:null,stopId:null,stopCode:null,stopName:'',destName:''};
let favs = loadFavs();

// ── Favs via URL hash ──
function loadFavs(){
  try{const m=location.hash.match(/^#favs=(.+)$/);if(m)return JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){}
  return [];
}
function saveFavsToHash(){
  try{history.replaceState(null,'','#favs='+btoa(unescape(encodeURIComponent(JSON.stringify(favs)))))}catch(e){}
}

(function(){
  const html=document.documentElement,btn=document.querySelector('[data-theme-toggle]');
  let dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  html.setAttribute('data-theme',dark?'dark':'light');

    ?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'

function toast(msg,ms=2400){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),ms);}
function fj(url){return fetch(url).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});}
function onCoChange(){document.getElementById('mtrNote').style.display=document.getElementById('companySelect').value==='MTR'?'block':'none';}

// ── Search ──
async function doSearch(){
  const company=document.getElementById('companySelect').value;
  const route=document.getElementById('routeInput').value.trim().toUpperCase();
  const dir=document.getElementById('dirSelect').value;
  if(!route){toast('請輸入路線號碼');return;}
  S.company=company;S.route=route;S.dir=dir;
  const btn=document.getElementById('searchBtn');
  btn.textContent='搜尋中…';btn.disabled=true;
  document.getElementById('stopSection').style.display='none';
  document.getElementById('etaSection').style.display='none';
  try{
    company==='MTR'?searchMTR(route,dir):await searchBus(company,route,dir);
  }catch(e){toast('搜尋失敗，請確認路線號碼');console.error(e);}
  btn.textContent='搜尋站點';btn.disabled=false;
}

// KMB / CTB
async function searchBus(co,route,dir){
  const rs=co==='KMB'
    ?await fj(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dir}/1`)
    :await fj(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`);
  const stops=rs.data;
  if(!stops||!stops.length){toast('找不到此路線/方向，請確認');return;}
  let dest='';
  try{
    const ri=co==='KMB'
      ?await fj(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}/${dir}/1`)
      :await fj(`https://rt.data.gov.hk/v2/transport/citybus/route/CTB/${route}`);
    dest=ri.data?.dest_tc||ri.data?.dest_en||'';
  }catch(e){}
  S.destName=dest;
  const details=await Promise.all(stops.slice(0,60).map(s=>{
    const url=co==='KMB'
      ?`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`
      :`https://rt.data.gov.hk/v2/transport/citybus/stop/${s.stop}`;
    return fj(url).catch(()=>null);
  }));
  const list=document.getElementById('stopList');
  list.innerHTML='';
  stops.forEach((s,i)=>{
    const d=details[i]?.data;
    const tc=d?(d.name_tc||d.name_en||'站'+(i+1)):'站'+(i+1);
    const en=d?(d.name_en||''):'';
    addStop(list,parseInt(s.seq||i+1),s.stop,null,tc,en);
  });
  show('stopSection');
}

// MTR Bus — use embedded data, NO fetch needed
function searchMTR(route,dir){
  const apiDir=dir==='outbound'?'O':'I';
  let stops=(MTR_ROUTES[route]||[]).filter(s=>s.dir===apiDir);
  // Circular routes only have O direction
  if(!stops.length) stops=(MTR_ROUTES[route]||[]);
  if(!stops.length){toast('找不到 '+route+' 的站點。可用路線：K12、K14、K17、K18、K51、K51A、K52、K53、K53S、K58、K65、K73、506 等');return;}
  stops=stops.sort((a,b)=>a.seq-b.seq);
  S.destName='';
  const list=document.getElementById('stopList');
  list.innerHTML='';
  stops.forEach(s=>addStop(list,s.seq,null,s.code,s.tc||s.en||s.code,s.en));
  show('stopSection');
}

function addStop(list,seq,stopId,stopCode,tc,en){
  const div=document.createElement('div');
  div.className='stop-item';
  div.innerHTML=`<span class="stop-seq">${seq}</span><div class="stop-info"><div class="stop-name">${tc}</div>${en&&en!==tc?`<div class="stop-sub">${en}</div>`:''}</div><svg class="stop-chk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
  div.addEventListener('click',()=>pickStop(div,seq,stopId,stopCode,tc));
  list.appendChild(div);
}

async function pickStop(el,seq,stopId,stopCode,tc){
  document.querySelectorAll('.stop-item').forEach(i=>i.classList.remove('selected'));
  el.classList.add('selected');
  S.stopSeq=seq;S.stopId=stopId;S.stopCode=stopCode;S.stopName=tc;
  const isMtr=S.company==='MTR';
  document.getElementById('etaBadge').textContent=S.route;
  document.getElementById('etaDest').textContent='往 '+(S.destName||'終點站');
  document.getElementById('etaSname').textContent=tc;
  isMtr?document.getElementById('etaHead').classList.add('mtr'):document.getElementById('etaHead').classList.remove('mtr');
  show('etaSection');
  await loadETA();
}

// ── ETA ──
async function loadETA(){
  document.getElementById('etaRows').innerHTML='<div class="status-box"><p>載入中…</p></div>';
  document.getElementById('upd').textContent='';
  document.getElementById('refBtn').classList.add('spin');
  try{
    S.company==='MTR'?await mtrETA():await busETA();
  }catch(e){document.getElementById('etaRows').innerHTML='<div class="status-box"><p>無法取得資料，請稍後再試</p></div>';console.error(e);}
  document.getElementById('refBtn').classList.remove('spin');
  document.getElementById('upd').textContent='更新時間：'+new Date().toLocaleTimeString('zh-HK');
}
function doRefresh(){if(S.stopId||S.stopCode)loadETA();}

async function mtrETA(){
  const res=await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({language:'zh',routeName:S.route})
  });
  const data=await res.json();
  const targetId=(S.stopCode||S.stopId||'').toUpperCase();
  const busStop=(data.busStop||[]).find(bs=>bs.busStopId&&bs.busStopId.toUpperCase()===targetId);
  if(!busStop||!busStop.bus||!busStop.bus.length){noETA();return;}
  const now=new Date(),rows=document.getElementById('etaRows');
  rows.innerHTML='';
  busStop.bus.slice(0,3).forEach((b,i)=>{
    const arrSec=parseInt(b.arrivalTimeInSecond??'-1');
    const depSec=parseInt(b.departureTimeInSecond??'-1');
    const useSec=(arrSec>=0&&arrSec<86400)?arrSec:(depSec>=0&&depSec<86400?depSec:-1);
    let hm='—',mins='—',cls='normal';
    if(useSec>=0){
      const t=new Date(now.getTime()+useSec*1000);
      hm=t.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});
      const m=Math.round(useSec/60);
      if(m<=0){mins='即將';cls='arriving';}
      else if(m<=3){mins=m+' 分';cls='arriving';}
      else if(m<=8){mins=m+' 分';cls='soon';}
      else{mins=m+' 分';cls='normal';}
    } else {
      const txt=b.arrivalTimeText||b.departureTimeText||'';
      if(txt){mins=txt;cls='normal';}
    }
    rows.appendChild(mkRow(i+1,hm,mins,cls,''));
  });
}

async function busETA(){
  let etas;
  if(S.company==='KMB'){
    const d=await fj(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${S.stopId}`);
    etas=(d.data||[]).filter(e=>e.route===S.route&&parseInt(e.seq)===S.stopSeq);
  }else{
    const d=await fj(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${S.stopId}/${S.route}`);
    etas=(d.data||[]).filter(e=>e.route===S.route);
  }
  if(!etas||!etas.length){noETA();return;}
  const now=new Date(),rows=document.getElementById('etaRows');
  rows.innerHTML='';
  etas.slice(0,3).forEach((e,i)=>{
    const et=e.eta?new Date(e.eta):null;
    let hm='—',mins='—',cls='normal';
    if(et){
      hm=et.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});
      const m=Math.round((et-now)/60000);
      if(m<0){mins='已過';cls='gone';}
      else if(m===0){mins='即將';cls='arriving';}
      else if(m<=3){mins=m+' 分';cls='arriving';}
      else if(m<=8){mins=m+' 分';cls='soon';}
      else{mins=m+' 分';cls='normal';}
    }
    rows.appendChild(mkRow(i+1,hm,mins,cls,e.rmk_tc||e.rmk_en||''));
  });
}

function noETA(){
  document.getElementById('etaRows').innerHTML='<div class="status-box"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><h3>暫無班次資料</h3><p>此時段可能沒有服務</p></div>';
}

function mkRow(idx,hm,mins,cls,rmk){
  const d=document.createElement('div');
  d.className='eta-row';
  const showAfter=mins!=='—'&&mins!=='已過'&&mins!=='即將'&&!mins.includes('分鐘')&&!mins.includes('到站')&&!mins.includes('離開');
  d.innerHTML=`<div class="eta-idx">${idx}</div><div class="eta-tb"><div class="eta-hm">${hm}</div>${rmk?`<div class="eta-rmk">${rmk}</div>`:''}</div><div><div class="eta-min ${cls}">${mins}</div>${showAfter?'<div class="eta-lbl">後到站</div>':''}</div>`;
  return d;
}

function show(id){
  document.getElementById(id).style.display='block';
  document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});
}

// ── Favs ──
function renderFavs(){
  const list=document.getElementById('favList');
  if(!favs.length){list.innerHTML='<div class="status-box" style="padding:1.25rem"><p>未有常用路線，搜尋後可儲存</p></div>';return;}
  list.innerHTML='';
  favs.forEach((f,i)=>{
    const isMtr=f.company==='MTR';
    const co=f.company==='KMB'?'九巴':f.company==='CTB'?'城巴':'港鐵巴士';
    const item=document.createElement('div');
    item.className='fav-item';
    item.innerHTML=`<div class="fav-pill ${isMtr?'mtr':''}" onclick="loadFav(${i})">${f.route}</div><div class="fav-info-wrap" onclick="loadFav(${i})"><div class="fav-sname">${f.stopName}</div><div class="fav-dest">往 ${f.destName||'終點站'} · ${co} · ${f.dir==='outbound'?'去程':'回程'}</div></div><button class="fav-del" onclick="delFav(event,${i})" aria-label="刪除"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
    list.appendChild(item);
  });
}

function saveFav(){
  if(!S.stopId&&!S.stopCode){toast('請先選擇站點');return;}
  const key=S.stopCode||S.stopId;
  if(favs.some(f=>(f.stopCode||f.stopId)===key&&f.route===S.route)){toast('已儲存過此站點');return;}
  favs.push({company:S.company,route:S.route,dir:S.dir,stopSeq:S.stopSeq,stopId:S.stopId,stopCode:S.stopCode,stopName:S.stopName,destName:S.destName});
  saveFavsToHash();renderFavs();
  toast('✓ 已儲存！請將網址加入書籤以永久保留');
}
function delFav(e,i){e.stopPropagation();favs.splice(i,1);saveFavsToHash();renderFavs();toast('已刪除');}
async function loadFav(i){
  const f=favs[i];
  document.getElementById('companySelect').value=f.company;
  document.getElementById('routeInput').value=f.route;
  document.getElementById('dirSelect').value=f.dir;
  onCoChange();S={...S,...f};
  document.getElementById('etaBadge').textContent=f.route;
  document.getElementById('etaDest').textContent='往 '+(f.destName||'終點站');
  document.getElementById('etaSname').textContent=f.stopName;
  f.company==='MTR'?document.getElementById('etaHead').classList.add('mtr'):document.getElementById('etaHead').classList.remove('mtr');
  show('etaSection');await loadETA();
}

document.getElementById('routeInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
renderFavs();
</script>
